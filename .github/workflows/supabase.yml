name: Supabase deploy

# Quando uma migração chega na main, aplica no projeto de produção
# (PesquisaLubrificantes). Mudança de schema só por aqui, para o histórico do
# repositório e do banco ficarem iguais. Também dá para rodar à mão em
# Actions > Supabase deploy > Run workflow.
on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/**'
  workflow_dispatch:

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: udbaskofvhcaudyeolrd
    steps:
      - name: Conferir secrets
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ] || [ -z "$SUPABASE_DB_PASSWORD" ]; then
            echo "::error::Cadastre SUPABASE_ACCESS_TOKEN e SUPABASE_DB_PASSWORD em Settings > Secrets and variables > Actions."
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Ligar projeto
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Aplicar migrações
        run: supabase db push
