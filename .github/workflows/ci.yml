name: CI

# Roda em todo PR e na main: o mesmo build da Vercel (CI=true faz warning de
# ESLint quebrar o build, então o problema aparece aqui e não no deploy).
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
        env:
          CI: "true"

  migrations:
    # Confere se as migrações novas aplicariam sem erro (sem aplicar nada).
    # Só roda depois que os secrets do Supabase forem cadastrados no GitHub.
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v6
      - uses: supabase/setup-cli@v1
        if: env.SUPABASE_ACCESS_TOKEN != ''
        with:
          version: latest
      - name: Dry-run das migrações
        if: env.SUPABASE_ACCESS_TOKEN != ''
        run: |
          supabase link --project-ref udbaskofvhcaudyeolrd
          supabase db push --dry-run
